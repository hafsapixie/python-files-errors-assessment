<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1320" viewBox="0 0 1100 1320" role="img" aria-labelledby="attFlowTitle attFlowDesc">
  <title id="attFlowTitle">Attendance cleaner program flow</title>
  <desc id="attFlowDesc">Flow chart showing file reading, missing-file handling, a per-line cleaning loop, set de-duplication, sorting, CSV saving, and output.</desc>

  <defs>
    <marker id="attArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="attArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1100" height="1320" fill="#ffffff"/>
  <text x="40" y="34" fill="#0f172a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Attendance Cleaner — Program Flow</text>
  <text x="40" y="56" fill="#64748b" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Read, clean each line, remove duplicates, sort, save, and display</text>

  <!-- Legend -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#475569">
    <rect x="760" y="76" width="12" height="12" rx="3" fill="#dbeafe" stroke="#2563eb"/>
    <text x="778" y="86">input / process</text>
    <rect x="870" y="76" width="12" height="12" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="888" y="86">decision</text>
    <rect x="965" y="76" width="12" height="12" rx="3" fill="#dcfce7" stroke="#16a34a"/>
    <text x="983" y="86">success</text>
    <rect x="1050" y="76" width="12" height="12" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="1068" y="86">error</text>
  </g>

  <!-- Start -->
  <rect x="350" y="100" width="240" height="50" rx="25" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="131" text-anchor="middle" fill="#166534" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Start</text>
  <path d="M 470 150 L 470 180" stroke="#334155" stroke-width="1.8" marker-end="url(#attArrow)"/>

  <!-- Read input -->
  <rect x="310" y="180" width="320" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="205" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" font-weight="600">Read attendance.txt</text>
  <text x="470" y="225" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">one student name per line</text>
  <path d="M 470 240 L 470 270" stroke="#334155" stroke-width="1.8" marker-end="url(#attArrow)"/>

  <!-- File exists decision -->
  <path d="M 470 270 L 620 325 L 470 380 L 320 325 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="320" text-anchor="middle" fill="#4c1d95" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">attendance.txt</text>
  <text x="470" y="340" text-anchor="middle" fill="#4c1d95" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">found?</text>

  <!-- Yes -->
  <path d="M 470 380 L 470 410" stroke="#334155" stroke-width="1.8" marker-end="url(#attArrow)"/>
  <text x="482" y="400" fill="#166534" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700">Yes</text>

  <!-- No -> error -->
  <path d="M 620 325 L 780 325" stroke="#334155" stroke-width="1.8" marker-end="url(#attArrow)"/>
  <text x="640" y="316" fill="#b91c1c" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700">No</text>
  <rect x="780" y="295" width="280" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="920" y="320" text-anchor="middle" fill="#991b1b" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600">Print file-not-found</text>
  <text x="920" y="340" text-anchor="middle" fill="#991b1b" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">error and stop</text>

  <!-- Error path to End -->
  <path d="M 1060 325 L 1080 325 L 1080 1275 L 590 1275" stroke="#dc2626" stroke-width="1.6" fill="none" marker-end="url(#attArrowRed)"/>

  <!-- Raw lines -->
  <rect x="310" y="410" width="320" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="435" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Read raw lines</text>
  <text x="470" y="455" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">keep every line for cleaning</text>
  <path d="M 470 470 L 470 500" stroke="#334155" stroke-width="1.8" marker-end="url(#attArrow)"/>

  <!-- Loop start -->
  <rect x="310" y="500" width="320" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="525" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">For each raw line</text>
  <text x="470" y="545" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">start the comprehension loop</text>
  <path d="M 470 560 L 470 590" stroke="#334155" stroke-width="1.8" marker-end="url(#attArrow)"/>

  <!-- Clean -->
  <rect x="310" y="590" width="320" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="615" text-anchor="middle" fill="#1e3a8a" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700">name.strip().title()</text>
  <text x="470" y="635" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">clean spaces and capitalization</text>
  <path d="M 470 650 L 470 680" stroke="#334155" stroke-width="1.8" marker-end="url(#attArrow)"/>

  <!-- Append -->
  <rect x="310" y="680" width="320" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="705" text-anchor="middle" fill="#166534" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Append to cleaned_names</text>
  <text x="470" y="725" text-anchor="middle" fill="#166534" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">keep the cleaned value</text>
  <path d="M 470 740 L 470 770" stroke="#334155" stroke-width="1.8" marker-end="url(#attArrow)"/>

  <!-- More lines decision -->
  <path d="M 470 770 L 620 825 L 470 880 L 320 825 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="470" y="820" text-anchor="middle" fill="#4c1d95" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">more lines?</text>
  <text x="470" y="840" text-anchor="middle" fill="#4c1d95" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">left to clean?</text>

  <!-- Yes loop back -->
  <path d="M 320 825 L 100 825 L 100 530 L 310 530" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#attArrow)"/>
  <text x="150" y="815" fill="#166534" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700">Yes</text>

  <!-- No down -->
  <path d="M 470 880 L 470 910" stroke="#334155" stroke-width="1.8" marker-end="url(#attArrow)"/>
  <text x="482" y="900" fill="#991b1b" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700">No</text>

  <!-- Set -->
  <rect x="310" y="910" width="320" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="935" text-anchor="middle" fill="#166534" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700">set(cleaned_names)</text>
  <text x="470" y="955" text-anchor="middle" fill="#166534" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">removes duplicate names</text>
  <path d="M 470 970 L 470 1000" stroke="#334155" stroke-width="1.8" marker-end="url(#attArrow)"/>

  <!-- Sort -->
  <rect x="310" y="1000" width="320" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="1025" text-anchor="middle" fill="#1e3a8a" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700">sorted(unique_students)</text>
  <text x="470" y="1045" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">alphabetical order</text>
  <path d="M 470 1060 L 470 1090" stroke="#334155" stroke-width="1.8" marker-end="url(#attArrow)"/>

  <!-- Save -->
  <rect x="310" y="1090" width="320" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="1115" text-anchor="middle" fill="#166534" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Save attendance_clean.csv</text>
  <text x="470" y="1135" text-anchor="middle" fill="#166534" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">one student_name per row</text>
  <path d="M 470 1150 L 470 1180" stroke="#334155" stroke-width="1.8" marker-end="url(#attArrow)"/>

  <!-- Display -->
  <rect x="310" y="1180" width="320" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="1205" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Display original count,</text>
  <text x="470" y="1225" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">unique count, and sorted list</text>
  <path d="M 470 1240 L 470 1270" stroke="#334155" stroke-width="1.8" marker-end="url(#attArrow)"/>

  <!-- End -->
  <rect x="350" y="1270" width="240" height="50" rx="25" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="1301" text-anchor="middle" fill="#166534" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">End</text>
</svg>