<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="700" viewBox="0 0 1360 700" role="img" aria-labelledby="umlTitle umlDesc">
  <title id="umlTitle">UML module diagram</title>
  <desc id="umlDesc">Module diagram showing the files, constants, functions, and calls for expense_tracker.py and attendance_cleaner.py.</desc>

  <defs>
    <marker id="umlArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="umlArrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1360" height="700" fill="#ffffff"/>
  <text x="40" y="34" fill="#0f172a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" font-weight="700">UML Module Diagram — Procedural Project</text>
  <text x="40" y="56" fill="#64748b" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Files, constants, functions, and «calls» relationships</text>

  <!-- Expense module -->
  <g>
    <rect x="40" y="80" width="620" height="560" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="40" y="80" width="620" height="50" rx="14" fill="#eff6ff"/>
    <rect x="40" y="116" width="620" height="14" fill="#eff6ff"/>
    <path d="M 40 116 L 660 116" stroke="#bfdbfe" stroke-width="1"/>
    <text x="60" y="101" fill="#1e3a8a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">«module» expense_tracker.py</text>
    <text x="640" y="101" text-anchor="end" fill="#2563eb" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600">procedural</text>

    <rect x="60" y="132" width="580" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="74" y="148" fill="#64748b" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">CONSTANTS</text>
    <text x="74" y="168" fill="#1f2937" font-family="Consolas, Courier New, monospace" font-size="10.5">EXPENSES_FILE = "expenses.csv"    FIELDNAMES = ["date", "item", "category", "amount"]</text>

    <rect x="280" y="198" width="160" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="360" y="225" text-anchor="middle" fill="#1e3a8a" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700">main()</text>

    <!-- main calls top-level functions -->
    <path d="M 360 243 L 360 258" stroke="#334155" stroke-width="1.6"/>
    <path d="M 116 258 L 584 258" stroke="#334155" stroke-width="1.6"/>
    <path d="M 116 258 L 116 273" stroke="#334155" stroke-width="1.6" marker-end="url(#umlArrow)"/>
    <path d="M 233 258 L 233 273" stroke="#334155" stroke-width="1.6" marker-end="url(#umlArrow)"/>
    <path d="M 350 258 L 350 273" stroke="#334155" stroke-width="1.6" marker-end="url(#umlArrow)"/>
    <path d="M 467 258 L 467 273" stroke="#334155" stroke-width="1.6" marker-end="url(#umlArrow)"/>
    <path d="M 584 258 L 584 273" stroke="#334155" stroke-width="1.6" marker-end="url(#umlArrow)"/>

    <g font-family="Consolas, Courier New, monospace" font-size="10.5" text-anchor="middle" fill="#1e3a8a">
      <rect x="60" y="273" width="112" height="45" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="116" y="300">load_expenses</text>

      <rect x="177" y="273" width="112" height="45" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="233" y="300">display_menu</text>

      <rect x="294" y="273" width="112" height="45" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="350" y="300">add_expense</text>

      <rect x="411" y="273" width="112" height="45" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="467" y="300">show_expenses</text>

      <rect x="528" y="273" width="112" height="45" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="584" y="300">total_by_category</text>
    </g>

    <!-- add_expense calls -->
    <path d="M 350 318 L 350 333" stroke="#334155" stroke-width="1.6"/>
    <path d="M 240 333 L 560 333" stroke="#334155" stroke-width="1.6"/>
    <path d="M 240 333 L 240 348" stroke="#334155" stroke-width="1.6" marker-end="url(#umlArrow)"/>
    <path d="M 400 333 L 400 348" stroke="#334155" stroke-width="1.6" marker-end="url(#umlArrow)"/>
    <path d="M 560 333 L 560 348" stroke="#334155" stroke-width="1.6" marker-end="url(#umlArrow)"/>
    <text x="360" y="328" fill="#475569" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" font-style="italic">«calls»</text>

    <g font-family="Consolas, Courier New, monospace" font-size="10.5" text-anchor="middle" fill="#1e3a8a">
      <rect x="170" y="348" width="140" height="45" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="240" y="375">prompt_non_empty</text>

      <rect x="330" y="348" width="140" height="45" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="400" y="375">prompt_amount</text>

      <rect x="490" y="348" width="140" height="45" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="560" y="375">save_expense</text>
    </g>

    <text x="60" y="430" fill="#64748b" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5">Python imports: csv, math, os</text>
    <text x="60" y="450" fill="#64748b" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5">main() loads the CSV, then loops through the menu until choice 4.</text>

    <rect x="60" y="470" width="580" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4 3"/>
    <text x="74" y="490" fill="#475569" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600">Menu options handled by main():</text>
    <text x="74" y="508" fill="#475569" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5">1 add · 2 show all · 3 totals by category · 4 exit</text>
    <text x="74" y="526" fill="#475569" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5">Invalid choices print a message and repeat the menu.</text>
  </g>

  <!-- Attendance module -->
  <g>
    <rect x="700" y="80" width="620" height="560" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="700" y="80" width="620" height="50" rx="14" fill="#f5f3ff"/>
    <rect x="700" y="116" width="620" height="14" fill="#f5f3ff"/>
    <path d="M 700 116 L 1320 116" stroke="#ddd6fe" stroke-width="1"/>
    <text x="720" y="101" fill="#4c1d95" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">«module» attendance_cleaner.py</text>
    <text x="1300" y="101" text-anchor="end" fill="#7c3aed" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600">procedural</text>

    <rect x="720" y="132" width="580" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="734" y="148" fill="#64748b" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">CONSTANTS</text>
    <text x="734" y="168" fill="#1f2937" font-family="Consolas, Courier New, monospace" font-size="10.5">INPUT_FILE = "attendance.txt"    OUTPUT_FILE = "attendance_clean.csv"</text>

    <rect x="940" y="198" width="160" height="45" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="1020" y="225" text-anchor="middle" fill="#4c1d95" font-family="Consolas, Courier New, monospace" font-size="13" font-weight="700">main()</text>

    <!-- main calls top-level functions -->
    <path d="M 1020 243 L 1020 258" stroke="#334155" stroke-width="1.6"/>
    <path d="M 788 258 L 1230 258" stroke="#334155" stroke-width="1.6"/>
    <path d="M 788 258 L 788 273" stroke="#334155" stroke-width="1.6" marker-end="url(#umlArrow)"/>
    <path d="M 935 258 L 935 273" stroke="#334155" stroke-width="1.6" marker-end="url(#umlArrow)"/>
    <path d="M 1082 258 L 1082 273" stroke="#334155" stroke-width="1.6" marker-end="url(#umlArrow)"/>
    <path d="M 1230 258 L 1230 273" stroke="#334155" stroke-width="1.6" marker-end="url(#umlArrow)"/>

    <g font-family="Consolas, Courier New, monospace" font-size="10.5" text-anchor="middle" fill="#4c1d95">
      <rect x="720" y="273" width="137" height="45" rx="7" fill="#f5f3ff" stroke="#c4b5fd"/>
      <text x="788" y="300">read_names</text>

      <rect x="867" y="273" width="137" height="45" rx="7" fill="#f5f3ff" stroke="#c4b5fd"/>
      <text x="935" y="300">clean_names</text>

      <rect x="1014" y="273" width="137" height="45" rx="7" fill="#f5f3ff" stroke="#c4b5fd"/>
      <text x="1082" y="300">save_clean_list</text>

      <rect x="1161" y="273" width="137" height="45" rx="7" fill="#f5f3ff" stroke="#c4b5fd"/>
      <text x="1230" y="300">display_results</text>
    </g>

    <!-- clean_names note -->
    <path d="M 1082 318 L 1082 338" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#umlArrowPurple)"/>
    <rect x="950" y="338" width="280" height="70" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-dasharray="4 3"/>
    <text x="964" y="358" fill="#5b21b6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600">clean_names() uses:</text>
    <text x="964" y="376" fill="#5b21b6" font-family="Consolas, Courier New, monospace" font-size="10">list comprehension: strip() + title()</text>
    <text x="964" y="394" fill="#5b21b6" font-family="Consolas, Courier New, monospace" font-size="10">set(): unique names, then sorted()</text>

    <text x="720" y="440" fill="#64748b" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5">Python imports: csv</text>
    <text x="720" y="460" fill="#64748b" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5">main() reads attendance.txt, cleans the names, and writes attendance_clean.csv.</text>

    <rect x="720" y="480" width="580" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4 3"/>
    <text x="734" y="500" fill="#475569" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600">Output columns:</text>
    <text x="734" y="518" fill="#475569" font-family="Consolas, Courier New, monospace" font-size="10">student_name</text>
    <text x="734" y="534" fill="#475569" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10">One cleaned, unique, alphabetically sorted student per row.</text>
  </g>

  <!-- Legend -->
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#475569">
    <path d="M 40 664 L 80 664" stroke="#334155" stroke-width="1.6" marker-end="url(#umlArrow)"/>
    <text x="90" y="668">«calls» relationship</text>
    <rect x="240" y="656" width="14" height="14" rx="3" fill="#eff6ff" stroke="#2563eb"/>
    <text x="260" y="668">expense module</text>
    <rect x="380" y="656" width="14" height="14" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
    <text x="400" y="668">attendance module</text>
    <rect x="530" y="656" width="14" height="14" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="550" y="668">constants / notes</text>
  </g>
</svg>