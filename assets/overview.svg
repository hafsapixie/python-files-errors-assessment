<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="overviewTitle overviewDesc">
  <title id="overviewTitle">Project overview</title>
  <desc id="overviewDesc">Two task cards: expense tracker and attendance cleaner, each showing file, topic, input, rules, output, and concepts.</desc>

  <rect width="1000" height="540" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Project Overview</text>
  <text x="500" y="66" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Two command-line tools for training-institute administration</text>

  <!-- Task 1 card -->
  <g>
    <rect x="30" y="90" width="460" height="400" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="30" y="90" width="460" height="72" rx="16" fill="#eff6ff"/>
    <rect x="30" y="136" width="460" height="26" fill="#eff6ff"/>
    <path d="M 30 136 L 490 136" stroke="#bfdbfe" stroke-width="1"/>

    <rect x="50" y="108" width="68" height="22" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="84" y="123" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">TASK 1</text>
    <text x="130" y="125" fill="#0f172a" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700">expense_tracker.py</text>
    <text x="50" y="153" fill="#475569" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">Record daily expenses, show records, and total by category.</text>

    <text x="50" y="183" fill="#2563eb" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">INPUT</text>
    <text x="50" y="202" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">Menu choice; date, item, category, and amount for</text>
    <text x="50" y="219" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">each new expense.</text>

    <text x="50" y="248" fill="#2563eb" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">RULES</text>
    <circle cx="55" cy="267" r="2.5" fill="#2563eb"/>
    <text x="66" y="271" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">Load expenses.csv on startup; start empty if missing.</text>
    <circle cx="55" cy="287" r="2.5" fill="#2563eb"/>
    <text x="66" y="291" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">Append every new expense so it survives restarts.</text>
    <circle cx="55" cy="307" r="2.5" fill="#2563eb"/>
    <text x="66" y="311" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">Catch ValueError for invalid amounts and ask again.</text>
    <circle cx="55" cy="327" r="2.5" fill="#2563eb"/>
    <text x="66" y="331" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">Use a set to list unique categories.</text>

    <text x="50" y="360" fill="#2563eb" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">OUTPUT</text>
    <text x="50" y="379" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">Formatted expense table, unique categories, category</text>
    <text x="50" y="396" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">totals, and grand total.</text>

    <text x="50" y="426" fill="#2563eb" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">CONCEPTS</text>
    <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">
      <rect x="50" y="440" width="100" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="100" y="456" fill="#1d4ed8">File Handling</text>
      <rect x="158" y="440" width="37" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="176.5" y="456" fill="#1d4ed8">CSV</text>
      <rect x="203" y="440" width="75" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="240.5" y="456" fill="#1d4ed8">ValueError</text>
      <rect x="286" y="440" width="37" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="304.5" y="456" fill="#1d4ed8">Set</text>
      <rect x="331" y="440" width="50" height="24" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="356" y="456" fill="#1d4ed8">Loops</text>
    </g>
  </g>

  <!-- Task 2 card -->
  <g>
    <rect x="510" y="90" width="460" height="400" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="510" y="90" width="460" height="72" rx="16" fill="#f5f3ff"/>
    <rect x="510" y="136" width="460" height="26" fill="#f5f3ff"/>
    <path d="M 510 136 L 970 136" stroke="#ddd6fe" stroke-width="1"/>

    <rect x="530" y="108" width="68" height="22" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="564" y="123" text-anchor="middle" fill="#5b21b6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">TASK 2</text>
    <text x="610" y="125" fill="#0f172a" font-family="Consolas, Courier New, monospace" font-size="17" font-weight="700">attendance_cleaner.py</text>
    <text x="530" y="153" fill="#475569" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">Clean attendance names, remove duplicates, sort, and export.</text>

    <text x="530" y="183" fill="#7c3aed" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">INPUT</text>
    <text x="530" y="202" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">attendance.txt: one raw student name per line.</text>

    <text x="530" y="248" fill="#7c3aed" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">RULES</text>
    <circle cx="535" cy="267" r="2.5" fill="#7c3aed"/>
    <text x="546" y="271" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">Clean each line with strip() and title() in a</text>
    <text x="546" y="287" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">list comprehension.</text>
    <circle cx="535" cy="307" r="2.5" fill="#7c3aed"/>
    <text x="546" y="311" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">Use a set to remove duplicate names.</text>
    <circle cx="535" cy="327" r="2.5" fill="#7c3aed"/>
    <text x="546" y="331" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">Sort the unique names alphabetically and save them</text>
    <text x="546" y="347" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">to attendance_clean.csv.</text>

    <text x="530" y="374" fill="#7c3aed" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">OUTPUT</text>
    <text x="530" y="393" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">Original count, unique count, duplicates removed, and the</text>
    <text x="530" y="410" fill="#1f2937" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5">cleaned, alphabetically sorted attendance list.</text>

    <text x="530" y="436" fill="#7c3aed" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.2">CONCEPTS</text>
    <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">
      <rect x="530" y="450" width="100" height="24" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
      <text x="580" y="464" fill="#5b21b6">File Handling</text>
      <rect x="638" y="450" width="131" height="24" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
      <text x="703.5" y="464" fill="#5b21b6">List Comprehension</text>
      <rect x="777" y="450" width="37" height="24" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
      <text x="795.5" y="464" fill="#5b21b6">Set</text>
      <rect x="822" y="450" width="62" height="24" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
      <text x="853" y="464" fill="#5b21b6">Sorting</text>
      <rect x="892" y="450" width="37" height="24" rx="12" fill="#f5f3ff" stroke="#c4b5fd"/>
      <text x="910.5" y="464" fill="#5b21b6">CSV</text>
    </g>
  </g>

  <text x="500" y="520" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">Both programs use plain Python, the csv module, and local text/CSV files.</text>
</svg>